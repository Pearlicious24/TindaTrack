<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TindaTrack — Sari-sari store tracker</title>
  <meta name="description" content="Inventory, sales and utang for your sari-sari store, all in one place." />
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="alternate icon" type="image/png" href="images/tindatrack_logo.png" />
  <link rel="apple-touch-icon" href="images/tindatrack_logo.png" />
  <meta name="theme-color" content="#ff6a00" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Slab:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=2" />
  <link rel="stylesheet" href="css/motion.css?v=2" />
</head>
<body>
  <!-- Full-screen views (onboarding, login) render here -->
  <div id="screen"></div>

  <!-- Main app shell -->
  <div id="app" class="app" hidden>
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar">
        <label class="search">
          <span class="icon" data-icon="search"></span>
          <input id="searchInput" type="search" placeholder="Search a product" autocomplete="off" />
        </label>
        <div class="topbar-actions">
          <button class="premium-pill" data-action="premium"><span class="icon" data-icon="diamond"></span>Premium</button>
          <button class="icon-btn" data-action="notifications" aria-label="Notifications">
            <span class="icon" data-icon="bell"></span><span class="dot" id="notifDot" hidden></span>
          </button>
        </div>
      </header>
      <main id="page" class="page"></main>
    </div>
    <nav class="bottom-nav" id="bottomNav"></nav>
  </div>

  <div id="modalRoot"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="chart-tip" id="chartTip" hidden></div>

  <script src="js/icons.js?v=2"></script>
  <script src="js/art.js?v=2"></script>
  <script src="js/photos.js?v=2"></script>
  <script src="js/data.js?v=2"></script>
  <script src="js/i18n.js?v=2"></script>
  <script src="js/ui.js?v=2"></script>
  <script src="js/pages.js?v=2"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
